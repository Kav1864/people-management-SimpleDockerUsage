<!DOCTYPE html>
<html>
<head>
    <title>People Management</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>People Management</h1>

        <h3>Add New Person</h3>

        <form id="peopleForm">

            <input type="text"
                   id="name"
                   placeholder="Enter Name"
                   required>

            <input type="number"
                   id="age"
                   placeholder="Enter Age"
                   required>

            <input type="email"
                   id="email"
                   placeholder="Enter Email"
                   required>

            <input type="text"
                   id="city"
                   placeholder="Enter City"
                   required>

            <button type="submit">Add Person</button>

        </form>

        <p id="message"></p>

        <h3>People Records</h3>

        <button onclick="getPeople()">View People</button>

        <div id="peopleList"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
